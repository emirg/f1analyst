services:
  backend:
    build: backend
    container_name: f1-analyst-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - ./backend/data:/app/data

  frontend:
    build: frontend
    container_name: f1-analyst-frontend
    ports:
      - "3001:3001"
    env_file:
      - frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - backend